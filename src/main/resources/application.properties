spring.application.name=telegram_radio

# Render задаёт PORT — используем его, локально падаем на 8080
server.port=${PORT:8080}

# БЕЗ пробела после запятой!
management.endpoints.web.exposure.include=mappings,health

# Токен — только из env, литерала нет
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
# chat-id опционален: пустая строка по умолчанию
telegram.chat-id=${TELEGRAM_CHAT_ID:}
telegram.api-url=https://api.telegram.org

# CORS: локально localhost:5173, на Render — адрес Cloudflare Pages
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}